<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B5CFF"/>
      <stop offset="0.55" stop-color="#4F7BFF"/>
      <stop offset="1" stop-color="#14CDE6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5B7CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5B7CFF" stop-opacity="0"/>
    </radialGradient>

    <!-- App-Icon: „L“ mit Level-Up-Pfeil und steigenden Balken -->
    <symbol id="icon" viewBox="0 0 512 512">
      <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
      <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#shine)"/>
      <rect x="1.5" y="1.5" width="509" height="509" rx="116.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>
      <g transform="translate(0,12)" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round">
        <polygon points="190,98 262,176 118,176"/>
        <rect x="158" y="170" width="64" height="222"/>
        <rect x="158" y="328" width="232" height="64"/>
      </g>
      <g transform="translate(0,12)">
        <rect x="252" y="250" width="54" height="62" rx="12" fill="#FFFFFF" fill-opacity="0.78"/>
        <rect x="324" y="186" width="54" height="126" rx="12" fill="#FFFFFF" fill-opacity="0.92"/>
      </g>
    </symbol>
  </defs>

  <rect width="1200" height="720" fill="#0B0D12"/>
  <circle cx="300" cy="340" r="320" fill="url(#glow)"/>

  <!-- Großes Icon -->
  <use href="#icon" xlink:href="#icon" x="110" y="150" width="380" height="380"/>

  <!-- Schriftzug -->
  <text x="560" y="330" font-family="Segoe UI Variable Display, Segoe UI, Inter, Arial, sans-serif" font-weight="700"
        font-size="138" letter-spacing="-4" fill="#F2F4F8">Layts</text>
  <text x="566" y="388" font-family="Segoe UI Variable Text, Segoe UI, Inter, Arial, sans-serif" font-weight="600"
        font-size="21" letter-spacing="7" fill="#8A93A6">SPIELSTAND-EDITOR</text>

  <!-- So sähe es in der Seitenleiste aus -->
  <rect x="560" y="440" width="380" height="96" rx="16" fill="#12151B" stroke="#262B35"/>
  <use href="#icon" xlink:href="#icon" x="584" y="460" width="56" height="56"/>
  <text x="658" y="494" font-family="Segoe UI Variable Display, Segoe UI, Inter, Arial, sans-serif" font-weight="700"
        font-size="30" letter-spacing="-0.5" fill="#F2F4F8">Layts</text>
  <text x="659" y="518" font-family="Segoe UI Variable Text, Segoe UI, Inter, Arial, sans-serif"
        font-size="14" fill="#8A93A6">Spielstand-Editor</text>

  <!-- Kleine Größen (Taskleiste, Fenster-Icon) -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5D6577">
    <use href="#icon" xlink:href="#icon" x="560" y="580" width="64" height="64"/>
    <text x="574" y="668">64 px</text>
    <use href="#icon" xlink:href="#icon" x="652" y="596" width="48" height="48"/>
    <text x="658" y="668">48 px</text>
    <use href="#icon" xlink:href="#icon" x="728" y="612" width="32" height="32"/>
    <text x="726" y="668">32 px</text>
    <use href="#icon" xlink:href="#icon" x="790" y="628" width="16" height="16"/>
    <text x="782" y="668">16 px</text>
  </g>
</svg>
